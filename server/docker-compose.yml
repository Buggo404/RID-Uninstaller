# Copy .env.example to .env and fill it in, then: docker compose up -d --build
name: rid

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rid
      POSTGRES_DB: rid
      POSTGRES_PASSWORD: ${RID_DB_PASSWORD:?set RID_DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rid -d rid"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rid:${RID_DB_PASSWORD}@db:5432/rid
      ADMIN_TOKEN: ${RID_ADMIN_TOKEN:?set RID_ADMIN_TOKEN}
      AI_PROTOCOL: ${AI_PROTOCOL:-chat}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-3000}
    ports:
      # RID_PORT may carry an address, e.g. 127.0.0.1:18730, to listen only for a reverse proxy on this machine.
      - "${RID_PORT:-8080}:8080"

volumes:
  db:
