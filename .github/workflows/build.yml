name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/crates/rid-app/pnpm-lock.yaml

      - name: Tests
        working-directory: client
        run: cargo test -p rid-core

      # Before the installer, which carries rid.exe.
      - name: Command line
        working-directory: client
        run: cargo build --release -p rid-cli

      - name: Installer
        working-directory: client/crates/rid-app
        env:
          RID_SERVER: ${{ vars.RID_SERVER }}
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $setup = Get-ChildItem client/target/release/bundle/nsis/*-setup.exe
          Copy-Item $setup.FullName ("dist/RID-Uninstaller-" + ($setup.Name -replace '^.*?_(\d+\.\d+\.\d+)_.*$', '$1') + "-setup.exe")
          Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt

      # What makes the installer acceptable to clients as an update. Skipped where the key is not
      # available (pull requests from forks). An installer signed afterwards with the code-signing
      # certificate needs this made again: client/scripts/sign.ps1 does both.
      - name: Update signature
        shell: pwsh
        working-directory: client/crates/rid-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { 'no updater key here'; exit 0 }
          pnpm tauri signer sign (Get-ChildItem ../../../dist/*-setup.exe).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: RID-Uninstaller
          path: dist/
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Server tests
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck

      - name: Admin interface
        working-directory: server/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Image
        run: docker build server

  # A tag starting with v produces a draft release. The installer in it is not code-signed yet: sign
  # it on the machine with the token (client/scripts/sign.ps1 -Stage installer), replace it and its
  # .sig, then publish and enter the address and the .sig on the server's admin page.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [client, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RID-Uninstaller
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$GITHUB_REF_NAME"
