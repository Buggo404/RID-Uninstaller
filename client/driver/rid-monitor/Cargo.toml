[package]
name = "rid-monitor"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rid-proto = { path = "../../crates/rid-proto" }

[build-dependencies]
bindgen = "0.73"

# Kernel code cannot unwind.
[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

# Built on its own: the kernel target needs different linker settings from the rest of Rid.
[workspace]
