[workspace]
resolver = "3"
members = ["crates/rid-core", "crates/rid-cli", "crates/rid-app"]

[workspace.package]
version = "0.1.6"
edition = "2024"

[workspace.dependencies]
rid-core = { path = "crates/rid-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
